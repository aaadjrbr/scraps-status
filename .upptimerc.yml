status-website:
  cname: status.scraps.sbs
  name: Scraps Status
  introTitle: "**SCR@PS** System Status"
  introMessage: "Real-time uptime monitoring."
  logoUrl: https://firebasestorage.googleapis.com/v0/b/scrap-be-yourself.firebasestorage.app/o/static%2Fpixe-star.webp?alt=media&token=985f3173-ff77-4266-91f9-d6f060a157bd
  navbar:
    - title: [ Return to Scr@ps ]
      href: https://scraps.sbs
  theme: light
  customCss: |
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
    
    body {
      background-color: #ede8f8 !important;
      color: #2a1a4a !important;
      font-family: 'Space Mono', monospace, Arial, sans-serif !important;
      position: relative;
    }
    
    /* Signature Scraps Noise Overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Links and Typography */
    a {
      color: #7856b8 !important;
      font-weight: 900 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.1em !important;
      text-decoration: none !important;
    }
    a:hover {
      text-decoration: underline !important;
      text-decoration-style: dashed !important;
      text-underline-offset: 4px !important;
    }

    h1, h2, h3, h4 {
      color: #5a3a99 !important;
      font-weight: 900 !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Layout borders */
    header, nav {
      background-color: transparent !important;
      border-bottom: 1px dashed rgba(120, 86, 184, 0.4) !important;
    }
    
    footer {
      border-top: 1px dashed rgba(120, 86, 184, 0.4) !important;
      text-transform: uppercase;
      font-size: 10px !important;
      letter-spacing: 2px;
    }

    /* Signature Torn Paper Cards */
    section, .card {
      background-color: #f0e8ff !important;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.12) !important;
      border: 1px solid rgba(120, 86, 184, 0.2) !important;
      border-radius: 0px !important;
      clip-path: polygon(0% 2%, 4% 0%, 9% 2%, 14% 0%, 21% 3%, 28% 0%, 36% 2%, 44% 1%, 52% 3%, 60% 0%, 68% 2%, 76% 0%, 84% 2%, 92% 0%, 98% 3%, 100% 0%, 99% 30%, 100% 60%, 98% 90%, 100% 100%, 95% 98%, 88% 100%, 81% 97%, 74% 100%, 67% 98%, 60% 100%, 53% 97%, 46% 100%, 39% 98%, 32% 100%, 25% 97%, 18% 100%, 11% 98%, 0% 100%, 2% 70%, 0% 40%, 3% 10%) !important;
      padding: 20px !important;
      margin-bottom: 20px !important;
    }

    /* Uptime Number styling */
    .text-4xl, .text-5xl, .text-green-500 {
      color: #b026ff !important;
      font-weight: 900 !important;
      text-shadow: 2px 2px 0px rgba(120, 86, 184, 0.2);
    }
