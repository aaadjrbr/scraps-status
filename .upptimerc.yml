owner: aaadjrbr
repo: scraps-status

sites:
  - name: Scraps Homepage
    url: https://scraps.sbs

  - name: Login
    url: https://scraps.sbs/login

  - name: Sign Up
    url: https://scraps.sbs/signup

status-website:
  cname: status.scraps.sbs

  name: Scr@ps Status

  introTitle: "**SCR@PS** System Status"

  introMessage: "🟢 Realtime infrastructure and service monitoring for Scr@ps."

  logoUrl: https://firebasestorage.googleapis.com/v0/b/scrap-be-yourself.firebasestorage.app/o/static%2Fscrap-2dpixel-icon.webp?alt=media&token=62874557-adee-4964-b7db-a0ccf1c2b4dd

  favicon: https://firebasestorage.googleapis.com/v0/b/scrap-be-yourself.firebasestorage.app/o/static%2Fpixe-star.webp?alt=media&token=985f3173-ff77-4266-91f9-d6f060a157bd

  navbar:
    - title: Back to Scr@ps
      href: https://scraps.sbs

  theme: light

  customCss: |
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    :root {
      --bg: #efe9ff;
      --surface: rgba(255,255,255,0.72);
      --surface-solid: #f8f4ff;
      --border: rgba(120, 86, 184, 0.18);

      --text: #2c2147;
      --muted: #6f5d96;

      --accent: #8b5cf6;
      --accent-soft: rgba(139,92,246,0.12);

      --success: #22c55e;

      --shadow:
        0 10px 30px rgba(120,86,184,0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top left,
        rgba(139,92,246,0.12),
        transparent 35%),

        radial-gradient(circle at bottom right,
        rgba(168,85,247,0.08),
        transparent 30%),

        var(--bg) !important;

      color: var(--text) !important;

      font-family:
        'Space Mono',
        monospace !important;

      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle grain overlay */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.03;

      z-index: 9999;

      background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* navbar */

    header,
    nav {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    nav {
      padding-top: 20px !important;
    }

    nav a {
      color: var(--muted) !important;
      font-size: 13px !important;
      letter-spacing: 0.02em;
      transition: all .2s ease;
    }

    nav a:hover {
      color: var(--accent) !important;
      opacity: 1;
    }

    /* typography */

    h1,
    h2,
    h3,
    h4 {
      color: var(--text) !important;
      font-weight: 700 !important;
      letter-spacing: -0.04em;
      text-transform: none !important;
    }

    h1 {
      font-size: 3rem !important;
    }

    p,
    span,
    li {
      color: var(--muted) !important;
    }

    a {
      color: var(--accent) !important;
      text-decoration: none !important;
      transition: opacity .2s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    /* cards */

    section,
    .card {
      background: var(--surface) !important;

      backdrop-filter: blur(14px);

      border:
        1px solid var(--border) !important;

      border-radius: 22px !important;

      box-shadow: var(--shadow);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    section:hover,
    .card:hover {
      transform: translateY(-2px);

      border-color:
        rgba(139,92,246,0.28) !important;

      box-shadow:
        0 14px 40px rgba(120,86,184,0.12);
    }

    /* status colors */

    .text-green-500,
    .text-green-600 {
      color: var(--success) !important;
    }

    .text-red-500,
    .text-red-600 {
      color: #ef4444 !important;
    }

    .text-yellow-500,
    .text-yellow-600 {
      color: #f59e0b !important;
    }

    /* large titles */

    .text-4xl,
    .text-5xl {
      color: var(--accent) !important;
      font-weight: 700 !important;
      text-shadow: none !important;
      letter-spacing: -0.05em;
    }

    /* timeline */

    .status-day {
      border-radius: 999px !important;
    }

    /* buttons */

    button,
    .button,
    input[type="submit"] {
      background: var(--accent-soft) !important;

      color: var(--accent) !important;

      border:
        1px solid rgba(139,92,246,0.15) !important;

      border-radius: 14px !important;

      transition: all .2s ease;
    }

    button:hover,
    .button:hover,
    input[type="submit"]:hover {
      background:
        rgba(139,92,246,0.18) !important;
    }

    /* footer */

    footer {
      margin-top: 50px !important;

      background: transparent !important;

      border: none !important;

      opacity: 0.65;

      font-size: 12px !important;

      letter-spacing: 0.03em;
    }

    /* logo polish */

    img {
      image-rendering: pixelated;
    }

    /* mobile */

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem !important;
      }

      section,
      .card {
        border-radius: 18px !important;
      }
    }
